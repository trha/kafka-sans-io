[package]
name = "kafka-sans-io"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
elided_lifetimes_in_paths = "deny"

[dependencies]
crc32c = "0.6"
heapless = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
# Feature `testing`: the shared test helpers in `src/testing`.
bytes = { version = "1", optional = true }
compio = { version = "=0.19.2", features = ["net", "process", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
kafka-protocol = { version = "0.18", default-features = false, features = ["client", "broker"], optional = true }
proptest = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

[features]
testing = ["dep:bytes", "dep:compio", "dep:futures-util", "dep:kafka-protocol", "dep:proptest", "dep:serde_json", "dep:tempfile"]

[dev-dependencies]
kafka-sans-io = { path = ".", features = ["testing"] }
bytes = "1"
compio = { version = "=0.19.2", features = ["macros", "net", "process", "time"] }
futures-util = "0.3"
local-event = "=0.1.3"
kafka-protocol = { version = "0.18", default-features = false, features = ["client", "broker"] }
proptest = "1"

